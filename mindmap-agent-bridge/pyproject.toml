[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmap-agent-bridge"
version = "0.1.0"
description = "Outbound Agent discovery with explicitly enabled Claude, Codex or Kimi execution"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1", "websockets>=15,<16", "cryptography>=42,<47"]

[project.optional-dependencies]
claude = ["claude-agent-sdk==0.2.152", "psutil>=7,<8"]
codex = ["openai-codex-cli-bin==0.147.0", "psutil>=7,<8"]
kimi = ["psutil>=7,<8", "starlette>=0.40,<1", "uvicorn>=0.30,<1", "tomli>=2,<3; python_version < '3.11'"]

[project.scripts]
mindmap-agent-bridge = "mindmap_agent_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["mindmap_agent_bridge*"]
